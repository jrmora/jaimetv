<fieldset id="provider-filter" class="filter-chips">
  <legend class="fs-6">Dónde se puede ver</legend>
  {% set selected = filters.get('provider', []) %}
  <div class="d-flex flex-wrap align-items-center gap-2">
    <input class="btn-check" type="radio" name="provider" id="provider-all" value="" {% if not selected %}checked{% endif %}>
    <label class="btn btn-outline-secondary rounded-pill" for="provider-all">Todas</label>
    {% for provider in streaming_choices %}
    <input class="btn-check" type="radio" name="provider" id="provider-{{ loop.index }}" value="{{ provider.name }}" {% if selected == [provider.name] %}checked{% endif %}>
    <label class="provider-choice rounded" for="provider-{{ loop.index }}" title="{{ provider.name }}">
      {% if provider.filename %}
      <img src="{{ url_for('static', filename=provider.filename) }}" width="40" height="40" alt="{{ provider.name }}" loading="lazy">
      <span class="visually-hidden">{{ provider.name }}</span>
      {% else %}
      {{ provider.name }}
      {% endif %}
    </label>
    {% endfor %}
  </div>
</fieldset>
