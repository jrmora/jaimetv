<details id="provider-filter" class="border rounded" open>
  <summary class="fw-semibold p-2">Dónde se puede ver</summary>
  <div class="p-2 border-top">
    {% set selected = filters.get('provider', []) %}
    <div class="provider-scope">
      {% for label, value in [('Todas', ''), ('Netflix', 'Netflix'), ('Amazon Prime Video', 'Amazon Prime Video')] %}
      <label class="small">
        <input class="form-check-input flex-shrink-0" type="radio" name="provider" value="{{ value }}" {% if (value and selected == [value]) or (not value and not selected) %}checked{% endif %}>
        <span>{{ label }}</span>
      </label>
      {% endfor %}
    </div>
  </div>
</details>
