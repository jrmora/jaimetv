<fieldset id="provider-filter">
  <legend class="fs-6">Dónde se puede ver</legend>
  {% set selected = filters.get('provider', []) %}
  <div class="form-check">
    <input class="form-check-input" type="radio" name="provider" id="provider-all" value="" {% if not selected %}checked{% endif %}>
    <label class="form-check-label" for="provider-all">Todas</label>
  </div>
  {% for provider in streaming_choices %}
  <div class="form-check">
    <input class="form-check-input" type="radio" name="provider" id="provider-{{ loop.index }}" value="{{ provider.name }}" {% if selected == [provider.name] %}checked{% endif %}>
    <label class="form-check-label d-inline-flex align-items-center" for="provider-{{ loop.index }}" title="{{ provider.name }}">
      {% if provider.filename %}
      <img src="{{ url_for('static', filename=provider.filename) }}" width="28" height="28" class="rounded" alt="{{ provider.name }}" loading="lazy">
      <span class="visually-hidden">{{ provider.name }}</span>
      {% else %}
      {{ provider.name }}
      {% endif %}
    </label>
  </div>
  {% endfor %}
</fieldset>
