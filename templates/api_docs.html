{% extends "base.html" %}
{% block title %}API · JaimeTV{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui.css">
{% endblock %}
{% block page_heading %}API{% endblock %}
{% block content %}
<p>Documentación interactiva de las rutas JSON de JaimeTV.</p>
<div id="swagger-ui"
     data-spec-url="{{ url_for('openapi_spec') }}"
     data-sync-csrf="{{ sync_csrf }}"
     data-tmdb-csrf="{{ session['tmdb_csrf'] }}"></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" defer></script>
<script src="{{ url_for('static', filename='api-docs.js') }}" defer></script>
{% endblock %}
