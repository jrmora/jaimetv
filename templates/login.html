{% extends "base.html" %}
{% block title %}Iniciar sesión · PickIA{% endblock %}
{% block back_navigation %}{% endblock %}
{% block content %}
<div class="mx-auto col-md-6 col-lg-4">
  <h1 class="h3 mb-4">Iniciar sesión</h1>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ sync_csrf }}">
    <label class="form-label" for="username">Usuario</label>
    <input class="form-control mb-3" id="username" name="username" autocomplete="username" maxlength="200" required>
    <label class="form-label" for="password">Contraseña</label>
    <input class="form-control mb-3" type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required>
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
